# Runs on every pull request into main: lint the HTML, run the tests and dry-run build every
# Worker (make this a required status check). It needs no secrets and gets none: the Cloudflare
# token and every Worker secret live only in the `production` environment, which only the
# deploy job on main can reach. A PR's own copy of this file runs here, so anything this job
# could read, any branch could print.
name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
